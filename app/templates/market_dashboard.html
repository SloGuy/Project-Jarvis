<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Jarvis Market Intelligence</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #0b1020;
            --panel: #141b2d;
            --panel-light: #1c263d;
            --text: #f5f7ff;
            --muted: #9ba8c7;
            --positive: #45d483;
            --negative: #ff6b7a;
            --warning: #f4c95d;
            --border: #2a3652;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--background);
            color: var(--text);
        }

        main {
            width: min(1500px, 96%);
            margin: 0 auto;
            padding: 28px 0 60px;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .subtitle,
        .muted {
            color: var(--muted);
        }

        .status {
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .grid {
            display: grid;
            gap: 18px;
        }

        .summary-grid {
            grid-template-columns:
                repeat(auto-fit, minmax(190px, 1fr));
            margin-bottom: 18px;
        }

        .market-grid {
            grid-template-columns:
                repeat(auto-fit, minmax(360px, 1fr));
            margin-bottom: 18px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        .metric {
            font-size: 1.7rem;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 0.82rem;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .positive {
            color: var(--positive);
        }

        .negative {
            color: var(--negative);
        }

        .neutral {
            color: var(--muted);
        }

        .alert {
            padding: 12px;
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .empty {
            color: var(--muted);
            padding: 12px 0;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            .market-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
<main>
    <header>
        <div>
            <h1>Jarvis Market Intelligence</h1>
            <p class="subtitle" id="summary">
                Loading intelligence...
            </p>
        </div>

        <div class="status" id="status">
            Loading
        </div>
    </header>

    <section class="grid summary-grid">
        <div class="panel">
            <div class="muted">Tracked Assets</div>
            <div class="metric" id="tracked-assets">—</div>
        </div>

        <div class="panel">
            <div class="muted">Stored Observations</div>
            <div class="metric" id="observations">—</div>
        </div>

        <div class="panel">
            <div class="muted">Active Movers</div>
            <div class="metric" id="movers-count">—</div>
        </div>

        <div class="panel">
            <div class="muted">Recent Alerts</div>
            <div class="metric" id="alerts-count">—</div>
        </div>
    </section>

    <section class="grid market-grid">
        <div class="panel">
            <h2>Stocks</h2>
            <table>
                <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Daily Change</th>
                </tr>
                </thead>
                <tbody id="stocks-body"></tbody>
            </table>
        </div>

        <div class="panel">
            <h2>Crypto</h2>
            <table>
                <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>24H Change</th>
                </tr>
                </thead>
                <tbody id="crypto-body"></tbody>
            </table>
        </div>
    </section>

    <section class="panel" style="margin-bottom: 18px;">
        <h2>Recent Movers</h2>
        <table>
            <thead>
            <tr>
                <th>Symbol</th>
                <th>Direction</th>
                <th>Move</th>
                <th>Latest Price</th>
                <th>Window</th>
            </tr>
            </thead>
            <tbody id="movers-body"></tbody>
        </table>
    </section>

    <section class="panel">
        <h2>Alerts</h2>
        <div id="alerts"></div>
    </section>
</main>

<script>
    function changeClass(value) {
        if (value > 0) {
            return "positive";
        }

        if (value < 0) {
            return "negative";
        }

        return "neutral";
    }

    function formatPrice(value) {
        if (value === null || value === undefined) {
            return "—";
        }

        return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: value < 10 ? 4 : 2,
        }).format(value);
    }

    function formatPercent(value) {
        if (value === null || value === undefined) {
            return "—";
        }

        const prefix = value > 0 ? "+" : "";

        return `${prefix}${value.toFixed(3)}%`;
    }

    function renderAssets(targetId, assets) {
        const body = document.getElementById(targetId);

        body.innerHTML = assets.map((asset) => `
            <tr>
                <td><strong>${asset.symbol}</strong></td>
                <td>${formatPrice(asset.price_usd)}</td>
                <td class="${changeClass(
                    asset.provider_change_percent
                )}">
                    ${formatPercent(
                        asset.provider_change_percent
                    )}
                </td>
            </tr>
        `).join("");
    }

    async function loadIntelligence() {
        try {
            const response = await fetch("/market/intelligence");

            if (!response.ok) {
                throw new Error(
                    `Request failed with status ${response.status}`
                );
            }

            const data = await response.json();

            document.getElementById("status").textContent =
                data.status;

            document.getElementById("summary").textContent =
                data.summary;

            document.getElementById("tracked-assets").textContent =
                data.database.active_assets;

            document.getElementById("observations").textContent =
                data.database.total_observations;

            document.getElementById("movers-count").textContent =
                data.movers.count;

            document.getElementById("alerts-count").textContent =
                data.alerts.returned;

            renderAssets(
                "stocks-body",
                data.market.stocks
            );

            renderAssets(
                "crypto-body",
                data.market.crypto
            );

            const moversBody =
                document.getElementById("movers-body");

            if (data.movers.assets.length === 0) {
                moversBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            No assets currently exceed the mover threshold.
                        </td>
                    </tr>
                `;
            } else {
                moversBody.innerHTML =
                    data.movers.assets.map((move) => `
                        <tr>
                            <td><strong>${move.symbol}</strong></td>
                            <td class="${changeClass(
                                move.interval_change_percent
                            )}">
                                ${move.direction}
                            </td>
                            <td class="${changeClass(
                                move.interval_change_percent
                            )}">
                                ${formatPercent(
                                    move.interval_change_percent
                                )}
                            </td>
                            <td>
                                ${formatPrice(
                                    move.latest_price_usd
                                )}
                            </td>
                            <td>
                                ${move.requested_comparison_minutes}
                                min
                            </td>
                        </tr>
                    `).join("");
            }

            const alerts =
                document.getElementById("alerts");

            if (data.alerts.alerts.length === 0) {
                alerts.innerHTML = `
                    <div class="empty">
                        No market alerts are active.
                    </div>
                `;
            } else {
                alerts.innerHTML =
                    data.alerts.alerts.map((alert) => `
                        <div class="alert">
                            <strong>
                                ${alert.symbol}
                                · ${alert.severity}
                            </strong>
                            <div>${alert.message}</div>
                        </div>
                    `).join("");
            }
        } catch (error) {
            document.getElementById("status").textContent =
                "error";

            document.getElementById("summary").textContent =
                error.message;
        }
    }

    loadIntelligence();
    setInterval(loadIntelligence, 60000);
</script>
</body>
</html>
